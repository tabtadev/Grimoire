<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimoire — Fiches de personnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<style>
  :root{
    --bg:#12141a;
    --surface:#1a1d24;
    --surface-2:#21252d;
    --border:#2e333d;
    --text:#e6e2d6;
    --text-muted:#888d97;
    --accent:#a33d3d;
    --brass:#c19a56;
    --gold:#e0c987;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    display:flex; min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:'Spectral',serif; }
  input,textarea,select,button{ font-family:inherit; color:inherit; }
  input,textarea,select{
    background:var(--surface-2); border:1px solid var(--border); border-radius:4px;
    padding:6px 8px; font-size:14px; color:var(--text);
  }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--brass); }
  textarea{ resize:vertical; line-height:1.5; }
  button{
    cursor:pointer; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:4px; padding:7px 12px; font-size:13px; font-weight:500;
    transition:border-color .15s, color .15s;
  }
  button:hover{ border-color:var(--brass); color:var(--brass); }
  button.danger:hover{ border-color:var(--accent); color:var(--accent); }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#f2e9e4; }
  button.primary:hover{ border-color:#c95656; color:#fff; }
  button.ghost{ background:transparent; border-color:transparent; padding:6px 4px; }
  button.roll-btn{ background:none; border:none; padding:0; font:inherit; }
  label{ font-size:11px; color:var(--text-muted); display:block; margin-bottom:3px; letter-spacing:.02em; }

  /* ---------- Sidebar ---------- */
  #sidebar{ width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
  #sidebar-header{ padding:22px 18px 14px; border-bottom:1px solid var(--border); }
  .sidebar-title-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  #sidebar-header h1{ margin:0; font-size:22px; font-weight:600; }
  #sidebar-header p{ margin:4px 0 0; font-size:12px; color:var(--text-muted); font-style:italic; }
  #lang-toggle{ flex:none; padding:5px 8px; font-size:11px; min-width:36px; }
  #char-list{ flex:1; overflow-y:auto; padding:10px; }
  #char-search{ margin:0 10px 4px; width:calc(100% - 20px); font-size:13px; }
  .char-item{ padding:9px 10px; border-radius:5px; margin-bottom:4px; cursor:pointer; border:1px solid transparent;
    display:flex; align-items:center; gap:10px; }
  .char-item:hover{ background:var(--surface-2); }
  .char-item.active{ background:var(--surface-2); border-color:var(--brass); }
  .char-avatar{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-family:'Spectral',serif; font-weight:700; font-size:13px; color:#12141a; }
  .char-item .char-text{ min-width:0; flex:1; }
  .char-item .name{ font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .char-item .sub{ font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sidebar-footer{ padding:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  #sidebar-footer .row{ display:flex; gap:8px; }
  #sidebar-footer button{ flex:1; }
  #empty-state{ padding:20px 12px; color:var(--text-muted); font-size:13px; text-align:center; }
  .folder-tag{ font-size:12px; color:var(--gold); background:var(--surface-2); border:1px solid var(--border);
    border-radius:5px; padding:8px 10px; display:flex; align-items:center; gap:6px; }
  .folder-tag span.dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none; }
  .reconnect-banner{ background:#2a2210; border:1px solid var(--brass); border-radius:6px; padding:9px 10px; font-size:12px; }
  .reconnect-banner button{ margin-top:6px; width:100%; }
  .hint{ font-size:11px; color:var(--text-muted); }

  /* ---------- Main ---------- */
  #main{ flex:1; min-width:0; padding:34px 40px 100px; }
  #no-char{ max-width:520px; margin:80px auto; text-align:center; color:var(--text-muted); }
  #no-char h2{ color:var(--text); font-weight:500; }
  #sheet{ max-width:800px; margin:0 auto; }
  .sheet-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:6px; }
  .sheet-header .name-input{ font-family:'Spectral',serif; font-size:32px; font-weight:600; background:transparent;
    border:none; border-bottom:1px solid transparent; padding:2px 0; width:100%; }
  .sheet-header .name-input:focus{ border-bottom-color:var(--brass); }
  .sheet-actions{ display:flex; gap:6px; flex:none; }
  .subline{ display:flex; gap:18px; margin-bottom:26px; flex-wrap:wrap; }
  .subline input{ background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0;
    padding:3px 0; font-size:13px; color:var(--text-muted); width:auto; min-width:140px; }
  .subline .field{ display:flex; flex-direction:column; gap:2px; }

  section.block{ margin-bottom:34px; }
  section.block > h2{ font-size:14px; font-weight:600; color:var(--brass); margin:0 0 14px; padding-bottom:8px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:10px; }
  .stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px 12px; text-align:center; }
  .stat-box label{ text-align:center; }
  .stat-box input{ width:100%; text-align:center; font-size:18px; font-family:'Spectral',serif; font-weight:600;
    background:transparent; border:none; padding:2px; }

  .corruption-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:10px; }
  .computed-value{ font-size:18px; font-family:'Spectral',serif; font-weight:600; padding:2px; }
  .stat-box input.over-threshold, .stat-box .computed-value.over-threshold{ color:var(--accent); }

  .hp-quick-row{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .hp-quick-row input{ width:70px; text-align:center; }
  .hp-quick-row .hint{ margin-left:auto; }

  .death-saves{ display:flex; align-items:center; gap:16px; margin-top:12px; font-size:12px; color:var(--text-muted); }
  .death-saves .ds-group{ display:flex; align-items:center; gap:6px; }
  .ds-pip{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); background:transparent; padding:0; cursor:pointer; }
  .ds-pip.success{ border-color:var(--gold); }
  .ds-pip.success.filled{ background:var(--gold); }
  .ds-pip.failure{ border-color:var(--accent); }
  .ds-pip.failure.filled{ background:var(--accent); }

  .inspiration-btn{ font-size:18px; line-height:1; padding:7px 10px; }
  .inspiration-btn.active{ border-color:var(--gold); color:var(--gold); background:#2a2210; }

  .passive-row{ display:flex; gap:10px; margin:-4px 0 14px; position:relative; padding-top:6px; }
  .passive-box{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; text-align:center; }
  .passive-box .pv{ font-family:'Spectral',serif; font-size:17px; font-weight:700; }
  .passive-box .pl{ font-size:10px; color:var(--text-muted); }
  .passive-box{ position:relative; }
  .passive-box .pv-input{ width:72px; text-align:center; font-family:'Spectral',serif; font-size:17px; font-weight:700; background:transparent; border:none; padding:0; }
  .passive-reset{ position:absolute; top:-10px; right:0; font-size:10px; padding:3px 7px; }

  .score-stepper{ width:24px; height:24px; padding:0; font-size:14px; line-height:1; border-radius:4px; }

  .abilities-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .ability-card{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
  .ability-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .ability-top .aname{ font-size:12px; letter-spacing:.03em; color:var(--text-muted); }
  .ability-top .amod{ font-family:'Spectral',serif; font-size:26px; font-weight:700; color:var(--text); min-width:42px;
    text-align:right; cursor:pointer; }
  .ability-top .amod:hover{ color:var(--gold); }
  .ability-score-input{ width:56px; text-align:center; font-size:14px; }
  .ability-score-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .save-row, .skill-row{ display:flex; align-items:center; gap:7px; font-size:13px; padding:3px 0; }
  .save-row{ padding-top:6px; margin-top:6px; border-top:1px dashed var(--border); color:var(--text-muted); }
  .save-row .bonus, .skill-row .bonus{ margin-left:auto; font-family:'Spectral',serif; font-weight:600; color:var(--text);
    cursor:pointer; }
  .save-row .bonus:hover, .skill-row .bonus:hover{ color:var(--gold); }
  .save-row.proficient, .skill-row.proficient{ color:var(--text); }
  input[type=checkbox]{ width:14px; height:14px; accent-color:var(--brass); cursor:pointer; }

  table.weapons{ width:100%; border-collapse:collapse; }
  table.weapons th{ text-align:left; font-size:11px; color:var(--text-muted); font-weight:500; padding:0 8px 8px; }
  table.weapons td{ padding:4px 8px 4px 0; vertical-align:middle; }
  table.weapons td:first-child{ padding-left:0; }
  table.weapons .name-cell{ display:flex; align-items:center; gap:4px; }
  table.weapons .name-cell input{ flex:1; }
  table.weapons td.tohit input, table.weapons td.dmg input{ width:70px; }
  table.weapons td.rollcell{ white-space:nowrap; }
  table.weapons td.rm{ width:26px; text-align:center; }
  .roll-icon{ padding:4px 6px; font-size:14px; }

  .feature{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .feature-top{ display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .feature-top input.feature-title{ flex:1; font-family:'Spectral',serif; font-size:16px; font-weight:600; background:transparent;
    border:none; padding:2px 0; }
  .feature-cat{ width:120px; flex:none; font-size:11px; padding:5px 7px; }
  .feature textarea{ width:100%; min-height:120px; }
  .feature-group-title{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);
    margin:16px 0 8px; }
  .feature-group-title:first-child{ margin-top:0; }

  .spell-meta{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:8px; }
  .spell-meta input{ font-size:11px; padding:5px 6px; width:100%; min-width:0; }
  .spell-damage-row{ display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  #spells-container textarea{ min-height:150px; }
  .spell-damage-row input{ flex:1; min-width:0; }
  .spell-stat-value{ font-family:'Spectral',serif; font-size:18px; font-weight:700; }
  .spell-ability-select{ width:100%; text-align:center; background:transparent; border:none;
    font-family:'Spectral',serif; font-weight:600; font-size:15px; }

  .resource-card{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .resource-top{ display:flex; gap:6px; align-items:center; margin-bottom:10px; }
  .resource-top input.resource-name{ flex:1; font-family:'Spectral',serif; font-size:16px; font-weight:600;
    background:transparent; border:none; padding:2px 0; }
  .resource-pips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pip{ width:22px; height:22px; border-radius:50%; border:2px solid var(--brass); cursor:pointer; background:transparent; padding:0; }
  .pip.filled{ background:var(--brass); }
  .resource-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .resource-row label{ margin:0; white-space:nowrap; }
  .resource-row input[type=number]{ width:56px; }
  .resource-row input:not([type=number]){ flex:1; min-width:120px; }

  textarea.freeform{ width:100%; min-height:150px; }
  .add-link{ font-size:13px; color:var(--brass); background:none; border:none; padding:0; }
  .add-link:hover{ text-decoration:underline; }

  /* ---------- Emoji picker ---------- */
  .emoji-picker{ position:relative; display:inline-block; flex:none; }
  .emoji-picker summary{ list-style:none; cursor:pointer; width:30px; height:30px; display:flex; align-items:center;
    justify-content:center; border:1px solid var(--border); border-radius:4px; font-size:14px; }
  .emoji-picker summary::-webkit-details-marker{ display:none; }
  .emoji-picker summary:hover{ border-color:var(--brass); }
  .emoji-picker[open] summary{ border-color:var(--brass); }
  .emoji-grid{ position:absolute; top:110%; right:0; z-index:60; display:grid; grid-template-columns:repeat(8,1fr);
    gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:6px; width:232px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .emoji-opt{ background:none; border:none; padding:4px; font-size:16px; border-radius:4px; }
  .emoji-opt:hover{ background:var(--bg); }

  /* ---------- Roll log ---------- */
  #roll-log{ position:fixed; bottom:16px; right:16px; width:260px; max-height:60vh; overflow-y:auto;
    display:none; flex-direction:column; gap:6px; z-index:100; }
  #roll-log.show{ display:flex; }
  .roll-log-head{ display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-muted); }
  .roll-log-head button{ padding:2px 8px; font-size:11px; }
  .roll-entry{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px 10px;
    display:flex; align-items:center; gap:10px; animation:rollin .15s ease-out; }
  .roll-entry.latest{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(224,201,135,.16), 0 4px 18px rgba(0,0,0,.18); }
  .latest-badge{ display:inline-block; margin-left:6px; padding:2px 5px; border:1px solid var(--gold); border-radius:3px; color:var(--gold); font-size:9px; font-weight:600; letter-spacing:.03em; vertical-align:1px; }
  .roll-entry.crit{ border-color:var(--gold); }
  .roll-entry.fumble{ border-color:var(--accent); }
  @keyframes rollin{ from{ transform:translateY(6px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .rl-text{ flex:1; min-width:0; }
  .rl-label{ font-size:12px; font-weight:600; }
  .rl-detail{ font-size:11px; color:var(--text-muted); }
  .rl-total{ font-family:'Spectral',serif; font-size:20px; font-weight:700; flex:none; }
  .roll-entry.crit .rl-total{ color:var(--gold); }
  .roll-entry.fumble .rl-total{ color:var(--accent); }
  .spell-reminder{ position:fixed; left:50%; bottom:18px; transform:translate(-50%, 12px); z-index:120;
    background:var(--surface); border:1px solid var(--brass); color:var(--text); border-radius:6px;
    padding:9px 14px; font-size:12px; box-shadow:0 8px 28px rgba(0,0,0,.35); opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease; }
  .spell-reminder.show{ opacity:1; transform:translate(-50%, 0); }
  .dice-panel{ position:fixed; top:68px; right:28px; z-index:130; width:390px; max-width:calc(100vw - 32px); background:var(--surface); border:1px solid var(--brass); border-radius:8px; box-shadow:0 12px 36px rgba(0,0,0,.45); padding:14px; display:none; }
  .dice-panel.show{ display:block; }
  .dice-panel-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .dice-panel-title{ font-family:'Spectral',serif; font-size:17px; font-weight:600; color:var(--gold); }
  .dice-row{ display:grid; grid-template-columns:62px 1fr 34px; gap:7px; align-items:center; margin-bottom:7px; }
  .dice-row input,.dice-row select{ width:100%; }
  .dice-row .remove-dice{ padding:5px 7px; }
  .dice-actions{ display:flex; gap:7px; margin-top:10px; }
  .dice-actions button{ flex:1; }
  .dice-result{ margin-top:12px; padding-top:10px; border-top:1px solid var(--border); }
  .dice-result-group{ font-size:12px; margin-bottom:4px; }
  .dice-result-total{ margin-top:8px; font-family:'Spectral',serif; font-size:22px; font-weight:700; color:var(--gold); }
  .avatar-picker{ position:relative; flex:none; }
  .avatar-picker summary{ list-style:none; cursor:pointer; }
  .avatar-picker summary::-webkit-details-marker{ display:none; }
  .avatar-picker .emoji-grid{ top:110%; left:0; right:auto; }
  .sheet-actions .avatar-picker{ position:relative; flex:none; }
  .sheet-actions .avatar-picker summary.avatar-edit-btn{ width:34px; height:34px; box-sizing:border-box; border:1px solid var(--border); border-radius:4px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; color:var(--text); }
  .sheet-actions .avatar-picker summary.avatar-edit-btn:hover, .sheet-actions .avatar-picker[open] summary.avatar-edit-btn{ border-color:var(--brass); color:var(--brass); }
  .avatar-opt{ background:none; border:none; padding:5px; font-size:17px; border-radius:4px; }
  .avatar-opt:hover{ background:var(--bg); }
  .avatar-none{ font-size:11px; color:var(--text-muted); padding:5px; }

  /* ---------- Onboarding & save status ---------- */
  .onboard-banner{ display:flex; justify-content:space-between; align-items:center; gap:20px;
    background:var(--surface); border:1px solid var(--brass); border-radius:8px; padding:16px 18px; margin-bottom:24px; }
  .onboard-banner strong{ font-family:'Spectral',serif; font-size:15px; font-weight:600; }
  .onboard-actions{ display:flex; gap:8px; flex:none; }
  #save-status{ display:block; font-size:11px; color:var(--text-muted); margin:-4px 0 16px; min-height:14px; }
  #save-status.pending{ color:var(--brass); }
  .folder-required{ padding:10px 4px 2px; text-align:center; }
  .folder-required strong{ display:block; font-family:'Spectral',serif; font-size:14px; margin-bottom:6px; }
  .folder-required .hint{ margin-bottom:10px; }
  .folder-gate{ max-width:620px; margin:12vh auto 0; padding:42px; text-align:center; background:var(--surface); border:1px solid var(--brass); border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.25); }
  .folder-gate-icon{ font-size:42px; margin-bottom:12px; }
  .folder-gate h2{ margin:0 0 10px; font-family:'Spectral',serif; }
  .folder-gate p{ color:var(--text-muted); line-height:1.6; max-width:520px; margin:0 auto 20px; }
  .folder-gate button{ margin:0 4px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div class="sidebar-title-row"><div><h1>Grimoire</h1><p>Vos fiches de personnage, en local</p></div><button id="lang-toggle" type="button" title="Changer de langue">EN</button></div>
  </div>
  <input id="char-search" type="text" placeholder="🔎 Rechercher un personnage...">
  <div id="char-list"></div>
  <div id="sidebar-footer"></div>
  <input type="file" id="file-input" accept="application/json" style="display:none;">
  <datalist id="feature-categories">
    <option value="Classe">
    <option value="Sous-classe">
    <option value="Espèce">
    <option value="Historique">
    <option value="Don">
    <option value="Équipement magique">
    <option value="Autre">
  </datalist>
</div>

<div id="main"></div>

<div id="roll-log">
  <div class="roll-log-head"><span>Jets récents</span><button data-action="clear-rolls">Effacer</button></div>
  <div id="roll-log-entries"></div>
</div>

<div id="dice-panel" class="dice-panel">
  <div class="dice-panel-head"><div class="dice-panel-title">🎲 <span id="dice-panel-title">Lanceur de dés</span></div><button class="ghost" data-action="toggle-dice-panel">✕</button></div>
  <div id="dice-rows"></div>
  <div class="dice-actions"><button type="button" data-action="add-dice">+ Ajouter un dé</button><button type="button" class="primary" data-action="roll-custom-dice">Lancer</button></div>
  <div id="dice-result" class="dice-result"></div>
</div>
<script>
/* ---------------------------------------------------------------------
   Données de référence
--------------------------------------------------------------------- */
const ABILITY_LABELS = { str:'Force', dex:'Dextérité', con:'Constitution', int:'Intelligence', wis:'Sagesse', cha:'Charisme' };
const SKILLS = {
  str: [{k:'athletics', l:'Athlétisme'}],
  dex: [{k:'acrobatics', l:'Acrobaties'}, {k:'sleightOfHand', l:'Escamotage'}, {k:'stealth', l:'Discrétion'}],
  con: [],
  int: [{k:'arcana', l:'Arcanes'}, {k:'history', l:'Histoire'}, {k:'investigation', l:'Investigation'}, {k:'nature', l:'Nature'}, {k:'religion', l:'Religion'}],
  wis: [{k:'animalHandling', l:'Dressage'}, {k:'insight', l:'Perspicacité'}, {k:'medicine', l:'Médecine'}, {k:'perception', l:'Perception'}, {k:'survival', l:'Survie'}],

function setLanguage(lang){
  if (lang !== 'fr' && lang !== 'en') return;
  // Force any focused field to commit its latest value before re-rendering.
  if (document.activeElement && typeof document.activeElement.blur === 'function') document.activeElement.blur();
  flushPendingSaves();
  currentLanguage = lang;
  localStorage.setItem(LANG_KEY, currentLanguage);
  document.documentElement.lang = currentLanguage;
  renderAll();
  updateLanguageButton();
  const dicePanel = document.getElementById('dice-panel');
  if (dicePanel && dicePanel.classList.contains('show')) renderDicePanel();
}
function toggleLanguage(){ setLanguage(currentLanguage === 'fr' ? 'en' : 'fr'); }

  const btn = document.getElementById('lang-toggle');

}

function translatePage(){
  const toEnglish = currentLanguage === 'en';
  const pairs = new Map(toEnglish ? UI_TEXT_PAIRS : UI_TEXT_PAIRS.map(([fr,en]) => [en,fr]));
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const parent = node.parentElement;
    if (!parent || ['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(parent.tagName)) return;
    const raw = node.nodeValue;
    const trimmed = raw.trim();
    if (!trimmed) return;
    if (pairs.has(trimmed)) node.nodeValue = raw.replace(trimmed, pairs.get(trimmed));
    else if (toEnglish) {
      node.nodeValue = raw
        .replace(/Aucun personnage dans ce dossier\./g,'No characters in this folder.')
        .replace(/Aucun personnage\./g,'No characters.')
        .replace(/Cliquez sur « \+ Nouveau »\./g,'Click « + New ».')
        .replace(/Aucun résultat pour « (.*?) »\./g,'No results for “$1”.')
        .replace(/Modifié — sauvegarde en cours…/g,'Modified — saving…')
        .replace(/Enregistré sur disque à/g,'Saved to disk at')
        .replace(/Enregistré à/g,'Saved at')
        .replace(/Perception passive/g,'Passive Perception')
        .replace(/Investigation passive/g,'Passive Investigation')
        .replace(/Perspicacité passive/g,'Passive Insight')
        .replace(/ — jet/g,' — check').replace(/ — sauvegarde/g,' — save').replace(/ — attaque/g,' — attack').replace(/ — dégâts/g,' — damage')
        .replace(/aucune formule de dégâts/g,'no damage formula').replace(/formule invalide/g,'invalid formula');
    } else {
      node.nodeValue = raw
        .replace(/No characters in this folder\./g,'Aucun personnage dans ce dossier.')
        .replace(/No characters\./g,'Aucun personnage.')
        .replace(/Click « \+ New »\./g,'Cliquez sur « + Nouveau ».')
        .replace(/No results for “(.*?)”\./g,'Aucun résultat pour « $1 ».')
        .replace(/Modified — saving…/g,'Modifié — sauvegarde en cours…')
        .replace(/Saved to disk at/g,'Enregistré sur disque à')
        .replace(/Saved at/g,'Enregistré à')
        .replace(/Passive Perception/g,'Perception passive').replace(/Passive Investigation/g,'Investigation passive').replace(/Passive Insight/g,'Perspicacité passive')
        .replace(/ — check/g,' — jet').replace(/ — save/g,' — sauvegarde').replace(/ — attack/g,' — attaque').replace(/ — damage/g,' — dégâts')
        .replace(/no damage formula/g,'aucune formule de dégâts').replace(/invalid formula/g,'formule invalide');
    }
  });

  document.querySelectorAll('input[placeholder], textarea[placeholder]').forEach(el => {
    const frToEn = new Map(UI_TEXT_PAIRS);
    const enToFr = new Map(UI_TEXT_PAIRS.map(([fr,en]) => [en,fr]));
    const map = toEnglish ? frToEn : enToFr;
    if (map.has(el.placeholder)) el.placeholder = map.get(el.placeholder);
  });
  document.querySelectorAll('[title]').forEach(el => {
    const frToEn = new Map(UI_TEXT_PAIRS); const enToFr = new Map(UI_TEXT_PAIRS.map(([fr,en]) => [en,fr]));
    const map = toEnglish ? frToEn : enToFr;
    if (map.has(el.title)) el.title = map.get(el.title);
  });
  document.querySelectorAll('option').forEach(el => {
    const frToEn = new Map(UI_TEXT_PAIRS); const enToFr = new Map(UI_TEXT_PAIRS.map(([fr,en]) => [en,fr]));
    const map = toEnglish ? frToEn : enToFr;
    if (map.has(el.textContent.trim())) el.textContent = map.get(el.textContent.trim());
  });
}

let translationObserver;
function installTranslationObserver(){
  if (translationObserver) translationObserver.disconnect();
  let translating = false;
  translationObserver = new MutationObserver(() => {
    if (translating) return;
    translating = true;
    // Déconnecter l'observer pendant la traduction évite qu'il se
    // déclenche lui-même en boucle sur les changements de texte.
    translationObserver.disconnect();
    try {
      translatePage();
    } finally {
      translating = false;
      translationObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
    }
  });
  translationObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
}

  fileNames: {},          // charId -> nom réel du fichier .json
  pendingHandle: null,   // stored handle awaiting permission re-grant
  onboardDismissed: localStorage.getItem('grimoire-onboard-dismissed') === '1'
};

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultCharacter(name){
  const abilities = {};
  for (const key of Object.keys(ABILITY_LABELS)){
    const skills = {};
    SKILLS[key].forEach(s => skills[s.k] = false);
    abilities[key] = { score:10, save:false, skills };
  }
  return {
    id: uid(),
    name: name || ui('newCharacter'),

   Persistance — stockage local (fallback / mode par défaut)
--------------------------------------------------------------------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state.characters = raw ? JSON.parse(raw).map(normalizeCharacter) : [];
  }catch(e){ state.characters = []; }
  state.activeId = localStorage.getItem(ACTIVE_KEY) || (state.characters[0] && state.characters[0].id) || null;
}
function persistLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.characters));
  if (state.activeId) localStorage.setItem(ACTIVE_KEY, state.activeId);
}
function activeChar(){ return state.characters.find(c => c.id === state.activeId) || null; }

/* ---------------------------------------------------------------------
   Persistance — dossier lié (File System Access API, Chrome/Edge)
--------------------------------------------------------------------- */
function supportsFolderLink(){ return 'showDirectoryPicker' in window && window.self === window.top; }

async function tryReconnectFolder(){
  if (!supportsFolderLink() || !window.idbKeyval) return;
  try{
    const handle = await idbKeyval.get(DIR_KEY);
    if (!handle) return;
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if (perm === 'granted'){
      state.dirHandle = handle; state.mode = 'folder';
      await scanFolder();
    } else {
      state.pendingHandle = handle;
    }
  }catch(e){ /* handle no longer valid, ignore */ }
}

async function pickFolder(){
  if (!supportsFolderLink()){
    alert(ui('folderUnsupported'));
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({ mode:'readwrite' });
    if (window.idbKeyval) await idbKeyval.set(DIR_KEY, handle);
    state.dirHandle = handle; state.mode = 'folder'; state.pendingHandle = null;
    await scanFolder();
  }catch(e){ /* annulé par l'utilisateur */ }
}

async function reconnectFolder(){
  const handle = state.pendingHandle;
  if (!handle) return;
  try{
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if (perm === 'granted'){
      state.dirHandle = handle; state.mode = 'folder'; state.pendingHandle = null;
      await scanFolder();
    }
  }catch(e){}
}

function unlinkFolder(){
  flushPendingSaves();
  // Grimoire ne repasse plus en mode local : sans dossier, l'application est bloquée.
  state.mode = null;
  state.dirHandle = null;
  state.fileHandles = {};
  state.fileNames = {};
  state.pendingHandle = null;
  state.characters = [];
  state.activeId = null;
  if (window.idbKeyval) idbKeyval.del(DIR_KEY);
  renderAll();
}

async function scanFolder(){
  const handle = state.dirHandle;
  const loaded = [];
  state.fileHandles = {};
  state.fileNames = {};
  for await (const entry of handle.values()){
    if (entry.kind !== 'file' || !entry.name.toLowerCase().endsWith('.json')) continue;
    try{
      const file = await entry.getFile();
      const data = JSON.parse(await file.text());
      const items = Array.isArray(data) ? data : [data];
      items.forEach(raw => {
        if (!raw || typeof raw !== 'object') return;
        const ch = normalizeCharacter(Object.assign(defaultCharacter(raw.name), raw));
        if (!ch.id) ch.id = uid();
        loaded.push(ch);
        state.fileHandles[ch.id] = entry;
        state.fileNames[ch.id] = entry.name;
      });
    }catch(e){ console.warn('Fichier ignoré (JSON invalide) :', entry.name); }
  }
  state.characters = loaded;
  state.activeId = loaded[0] ? loaded[0].id : null;
}

function characterFilename(name){
  const clean = String(name || 'personnage')
    .replace(/[<>:"/\\|?*]/g, '-')
    .replace(/[\x00-\x1F]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/[. ]+$/g, '') || 'personnage';
  return `${clean}.json`;
}

async function uniqueCharacterFilename(desired, charId){
  if (!state.dirHandle) return desired;
  const current = state.fileNames[charId];
  if (current === desired) return desired;

  const lowerDesired = desired.toLowerCase();
  for (const [id, name] of Object.entries(state.fileNames)){
    if (id !== charId && name.toLowerCase() === lowerDesired) {
      const dot = desired.toLowerCase().endsWith('.json') ? desired.length - 5 : desired.length;
      const base = desired.slice(0, dot);
      let n = 2;
      while (true){
        const candidate = `${base} (${n}).json`;
        const used = Object.values(state.fileNames).some((v, idx) => v.toLowerCase() === candidate.toLowerCase() && Object.keys(state.fileNames)[idx] !== charId);
        if (!used) return candidate;
        n++;
      }
    }
  }

  try{
    await state.dirHandle.getFileHandle(desired, { create:false });
    // Existing file that isn't tracked: avoid overwriting it.
    let n = 2;
    const dot = desired.toLowerCase().endsWith('.json') ? desired.length - 5 : desired.length;
    const base = desired.slice(0, dot);
    while (true){
      const candidate = `${base} (${n}).json`;
      try{
        await state.dirHandle.getFileHandle(candidate, { create:false });
        n++;
      }catch(e){ return candidate; }
    }
  }catch(e){
    return desired;
  }
}

async function writeCharToDisk(ch){
  if (state.mode !== 'folder' || !state.dirHandle) return;
  try{
    let entry = state.fileHandles[ch.id];
    const desiredName = characterFilename(ch.name);
    const currentName = state.fileNames[ch.id];

    if (!entry){
      const filename = await uniqueCharacterFilename(desiredName, ch.id);
      entry = await state.dirHandle.getFileHandle(filename, { create:true });
      state.fileHandles[ch.id] = entry;
      state.fileNames[ch.id] = filename;
    } else if (currentName && currentName !== desiredName){
      const filename = await uniqueCharacterFilename(desiredName, ch.id);
      if (filename !== currentName){
        const newEntry = await state.dirHandle.getFileHandle(filename, { create:true });
        state.fileHandles[ch.id] = newEntry;
        state.fileNames[ch.id] = filename;
        try{ await state.dirHandle.removeEntry(currentName); }catch(e){}
        entry = newEntry;
      }
    }

    const writable = await entry.createWritable();
    await writable.write(JSON.stringify(ch, null, 2));
    await writable.close();
  }catch(e){ console.warn('Écriture impossible sur le disque', e); }
}
async function deleteCharFromDisk(ch){
  if (state.mode !== 'folder' || !state.dirHandle) return;
  const entry = state.fileHandles[ch.id];
  if (entry){
    try{ await state.dirHandle.removeEntry(entry.name); }catch(e){}
    delete state.fileHandles[ch.id];
    delete state.fileNames[ch.id];
  }
}

/* Point d'entrée unique pour toute sauvegarde après une modification */
const AUTOSAVE_DELAY = 800; // ms d'inactivité avant d'écrire sur disque

function nowTime(){
  return new Date().toLocaleTimeString(currentLanguage === 'fr' ? 'fr-FR' : 'en-CA', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function setSaveStatus(text, pending){
  const el = document.getElementById('save-status');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('pending', !!pending);
}

function saveState(){
  const c = activeChar();
  if (!c || state.mode !== 'folder') return;
  setSaveStatus(ui('modified'), true);
  clearTimeout(writeTimers[c.id]);
  writeTimers[c.id] = setTimeout(async () => {
    await writeCharToDisk(c);
    setSaveStatus(ui('savedDisk') + ' ' + nowTime());
  }, AUTOSAVE_DELAY);
}
function saveNow(ch){
  clearTimeout(writeTimers[ch.id]);
  if (state.mode === 'folder') writeCharToDisk(ch);
  if (ch.id === state.activeId) setSaveStatus(ui('savedDisk') + ' ' + nowTime());
}
function flushPendingSaves(){
  if (state.mode !== 'folder') return;
  Object.keys(writeTimers).forEach(id => {
    clearTimeout(writeTimers[id]);
    const ch = state.characters.find(x => x.id === id);
    if (ch) writeCharToDisk(ch);
  });
}
window.addEventListener('beforeunload', flushPendingSaves);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPendingSaves(); });

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function mod(score){ return Math.floor((Number(score) - 10) / 2); }
function fmt(n){ return (n >= 0 ? '+' : '') + n; }
function setPath(obj, path, value){
  const keys = path.split('.'); let o = obj;
  for (let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys[keys.length-1]] = value;
}
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normalizeCharacter(ch){
  ch.hp = Object.assign({ max:10, current:10, temp:0 }, ch.hp || {});
  ch.deathSaves = Object.assign({ success:0, failure:0 }, ch.deathSaves || {});
  ch.corruption = Object.assign({ temp:0, perm:0, current:0, threshold:6 }, ch.corruption || {});
  if (typeof ch.inspiration !== 'boolean') ch.inspiration = false;
  if (typeof ch.avatarEmoji !== 'string') ch.avatarEmoji = '';
  ch.passive = Object.assign({ perception:null, investigation:null, insight:null }, ch.passive || {});
  ['perception','investigation','insight'].forEach(k => { if (ch.passive[k] !== null && ch.passive[k] !== '' && !Number.isFinite(Number(ch.passive[k]))) ch.passive[k] = null; });
  return ch;
}
function slug(s){
  return (s || 'personnage').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'personnage';
}
function emojiPickerHTML(path){

/* ---------------------------------------------------------------------
   Dés
--------------------------------------------------------------------- */
function rand20(){ return 1 + Math.floor(Math.random()*20); }
function addRollEntry(label, detail, total, flag){
  rollLog.unshift({ label, detail, total, flag, id: Date.now()+Math.random() });
  if (rollLog.length > 8) rollLog.pop();
  renderRollLog();
}
function rollD20(label, bonus, mode){
  const d1 = rand20();
  const d2 = mode !== 'normal' ? rand20() : null;
  const picked = d2 === null ? d1 : (mode === 'adv' ? Math.max(d1,d2) : Math.min(d1,d2));
  const total = picked + bonus;
  const modeTxt = mode === 'adv' ? ` (${currentLanguage === 'fr' ? 'avantage' : 'advantage'})` : mode === 'dis' ? ` (${currentLanguage === 'fr' ? 'désavantage' : 'disadvantage'})` : '';
  const detail = d2 === null ? `d20(${d1}) ${fmt(bonus)}` : `d20(${d1}, ${d2} → ${picked}) ${fmt(bonus)}`;
  addRollEntry(label + modeTxt, detail, total, picked === 20 ? 'crit' : picked === 1 ? 'fumble' : '');
}
function rollDamage(label, formula){
  const clean = (formula || '').replace(/\s+/g,'');
  const tokens = clean.match(/[+-]?[^+-]+/g);
  if (!tokens){ addRollEntry(label, 'aucune formule de dégâts', '—', ''); return; }
  let total = 0; const parts = [];
  tokens.forEach(tok => {
    const sign = tok.startsWith('-') ? -1 : 1;
    const t = tok.replace(/^[+-]/,'');
    const dice = t.match(/^(\d*)d(\d+)$/i);
    if (dice){
      const n = Number(dice[1] || 1), sides = Number(dice[2]);
      const rolls = Array.from({length:n}, () => 1 + Math.floor(Math.random()*sides));
      total += sign * rolls.reduce((a,b) => a+b, 0);
      parts.push(`${sign<0?'-':''}${n}d${sides}(${rolls.join(',')})`);
    } else if (/^\d+$/.test(t)){
      total += sign * Number(t);
      parts.push(`${sign<0?'-':''}${t}`);
    }
  });
  addRollEntry(label, parts.join(' ') || 'formule invalide', total, '');
}
function renderRollLog(){
  const wrap = document.getElementById('roll-log');
  const box = document.getElementById('roll-log-entries');
  wrap.classList.toggle('show', rollLog.length > 0);
  box.innerHTML = rollLog.map((r, i) => `
    <div class="roll-entry ${r.flag} ${i === 0 ? 'latest' : ''}">
      <div class="rl-text"><div class="rl-label">${esc(r.label)}${i === 0 ? `<span class="latest-badge">${esc(ui('lastRoll'))}</span>` : ''}</div><div class="rl-detail">${esc(r.detail)}</div></div>
      <div class="rl-total">${r.total}</div>
    </div>`).join('');
}

const AVATAR_COLORS = ['#c19a56','#a33d3d','#5a8f8a','#7a8fc9','#a5729a','#8fa55a'];
function avatarColor(name){
  const s = name || '?';
  let hash = 0;
  for (let i=0;i<s.length;i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;

}

function renderPassiveRow(){
  const c = activeChar();
  const el = document.getElementById('passive-row');
  if (!el) return;
  const calc = (abilityKey, skillKey) => 10 + mod(c.abilities[abilityKey].score) + (c.abilities[abilityKey].skills[skillKey] ? c.proficiencyBonus : 0);
  const items = [
    ['perception', ui('passivePerception'), calc('wis','perception')],
    ['investigation', ui('passiveInvestigation'), calc('int','investigation')],
    ['insight', ui('passiveInsight'), calc('wis','insight')]
  ];
  el.innerHTML = items.map(([key,label,computed]) => {
    const override = c.passive[key];
    const value = override === null || override === '' || override === undefined ? computed : Number(override);
    return `<div class="passive-box"><input type="number" class="pv-input" data-path="passive.${key}" value="${value}" title="${esc(ui('passiveReset'))}"><div class="pl">${esc(label)}</div></div>`;
  }).join('');
  el.insertAdjacentHTML('beforeend', `<button type="button" class="ghost passive-reset" data-action="reset-passives" title="${esc(ui('passiveReset'))}">↺ ${esc(ui('passiveReset'))}</button>`);
}

function renderCorruption(){
  const c = activeChar();
  const container = document.getElementById('corruption-container');
  if (!container) return;
  const temp = Number(c.corruption.temp) || 0;
  const perm = Number(c.corruption.perm) || 0;
  const threshold = Number(c.corruption.threshold) || 0;
  const current = temp + perm;

  const permOver = perm > threshold;

  container.innerHTML = `
    <div class="corruption-row">
      <div class="stat-box"><label>Temporaire</label><input type="number" data-path="corruption.temp" data-recompute="corruption" value="${temp}"></div>

      <div class="stat-box"><label>Seuil</label><input type="number" data-path="corruption.threshold" data-recompute="corruption" value="${threshold}"></div>

function spellStats(c){
  const key = c.spellcastingAbility;
  const m = mod(c.abilities[key].score);
  return { m, dc: 8 + c.proficiencyBonus + m, atk: c.proficiencyBonus + m, corruptionCalc: (c.proficiencyBonus + m) * 2 };
}

   Jets — gestion des clics sur les boutons de dé
--------------------------------------------------------------------- */
function handleRoll(btn, e){
  const c = activeChar(); if (!c) return;
  const type = btn.dataset.roll;
  const mode = e.shiftKey ? 'adv' : (e.altKey || e.ctrlKey || e.metaKey) ? 'dis' : 'normal';
  if (type === 'ability'){
    const key = btn.dataset.ability;
    rollD20(`${tAbility(key)} — ${currentLanguage === 'fr' ? 'jet' : 'check'}`, mod(c.abilities[key].score), mode);
  } else if (type === 'save'){
    const key = btn.dataset.ability, a = c.abilities[key];
    rollD20(`${tAbility(key)} — ${currentLanguage === 'fr' ? 'sauvegarde' : 'save'}`, mod(a.score) + (a.save ? c.proficiencyBonus : 0), mode);
  } else if (type === 'skill'){
    const key = btn.dataset.ability, skill = btn.dataset.skill, a = c.abilities[key];
    const bonus = mod(a.score) + (a.skills[skill] ? c.proficiencyBonus : 0);
    rollD20(btn.dataset.label, bonus, mode);
  } else if (type === 'attack'){
    const w = c.weapons[Number(btn.dataset.index)];
    rollD20(`${w.name || (currentLanguage === 'fr' ? 'Arme' : 'Weapon')} — ${currentLanguage === 'fr' ? 'attaque' : 'attack'}`, parseInt(w.toHit) || 0, mode);
  } else if (type === 'damage'){
    const w = c.weapons[Number(btn.dataset.index)];
    const formula = [w.damage, w.damageBonus].filter(Boolean).join('+').replace(/\+\+/g,'+').replace(/\+-/g,'-');
    rollDamage(`${w.name || (currentLanguage === 'fr' ? 'Arme' : 'Weapon')} — ${currentLanguage === 'fr' ? 'dégâts' : 'damage'}`, formula);
  } else if (type === 'spell-attack'){
    const sp = c.spells[Number(btn.dataset.index)];
    rollD20(`${sp.title || (currentLanguage === 'fr' ? 'Sort' : 'Spell')} — ${currentLanguage === 'fr' ? 'attaque' : 'attack'}`, spellStats(c).atk, mode);
    showSpellReminder();
  } else if (type === 'spell-damage'){
    const sp = c.spells[Number(btn.dataset.index)];
    rollDamage(`${sp.title || (currentLanguage === 'fr' ? 'Sort' : 'Spell')} — ${currentLanguage === 'fr' ? 'dégâts' : 'damage'}`, sp.damage);
    showSpellReminder();
  } else if (type === 'resource'){
    const r = c.resources[Number(btn.dataset.index)];
    rollDamage(`${r.name || (currentLanguage === 'fr' ? 'Ressource' : 'Resource')}`, r.formula);
  }
}

let customDiceRows = [{ count:1, sides:20 }];
function diceRowHTML(row, i){
  return `<div class="dice-row" data-dice-row="${i}">
    <input type="number" min="1" max="100" value="${row.count}" data-dice-count="${i}" title="${esc(ui('diceCount'))}">
    <select data-dice-sides="${i}" title="${esc(ui('diceSides'))}">${[2,4,6,8,10,12,20,100].map(n => `<option value="${n}" ${Number(row.sides)===n?'selected':''}>d${n}</option>`).join('')}</select>
    <button type="button" class="ghost remove-dice" data-action="remove-dice" data-index="${i}">✕</button>
  </div>`;
}
function renderDicePanel(){
  const panel=document.getElementById('dice-panel'); if(!panel) return;
  document.getElementById('dice-panel-title').textContent=ui('diceRoller');
  document.getElementById('dice-rows').innerHTML=customDiceRows.map(diceRowHTML).join('');
  document.querySelector('#dice-panel [data-action=add-dice]').textContent='+ '+ui('addDice');
  document.querySelector('#dice-panel [data-action=roll-custom-dice]').textContent=ui('rollDice');
}
function toggleDicePanel(){
  const panel=document.getElementById('dice-panel'); if(!panel) return;
  panel.classList.toggle('show');
  if(panel.classList.contains('show')) renderDicePanel();
}
function rollCustomDice(){
  if(!customDiceRows.length){ alert(ui('noDice')); return; }
  const groups=[]; let total=0;
  customDiceRows.forEach(row=>{
    const count=Math.max(1,Math.min(100,Number(row.count)||1));
    const sides=Math.max(2,Number(row.sides)||20);
    const rolls=Array.from({length:count},()=>1+Math.floor(Math.random()*sides));
    const subtotal=rolls.reduce((a,b)=>a+b,0); total+=subtotal;
    groups.push(`${count}d${sides}: ${rolls.join(', ')} = ${subtotal}`);
  });
  addRollEntry('🎲 '+ui('diceRoller'), groups.join(' · '), total, '');
  const result=document.getElementById('dice-result');
  if(result) result.innerHTML=groups.map(g=>`<div class="dice-result-group">${esc(g)}</div>`).join('')+`<div class="dice-result-total">${esc(ui('diceTotal'))}: ${total}</div>`;
}

document.body.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.path) return;
  const c = activeChar(); if (!c) return;
  const val = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
  setPath(c, el.dataset.path, val);
  saveState();
  const recompute = (el.dataset.recompute || '').split(',').filter(Boolean);
  if (recompute.includes('abilities')){ renderAbilities(); renderPassiveRow(); }
  if (recompute.includes('spellcasting')) renderSpellcasting();
  if (recompute.includes('resources')) renderResources();
  if (recompute.includes('corruption')) renderCorruption();
  if (el.dataset.path === 'name' || el.dataset.path === 'classLevel') renderSidebar();
});

document.body.addEventListener('click', e => {
  const avatarBtn = e.target.closest('.avatar-opt');
  if (avatarBtn){
    e.stopPropagation();
    const c = state.characters.find(x => x.id === avatarBtn.dataset.id);
    if (c){
      c.avatarEmoji = avatarBtn.dataset.avatarEmoji || '';
      saveNow(c);
      renderSidebar();
      renderMain();
    }
    const details = avatarBtn.closest('details');
    if (details) details.removeAttribute('open');
    return;
  }

  const emojiBtn = e.target.closest('.emoji-opt');
  if (emojiBtn){
    const c = activeChar();
    const input = document.querySelector(`[data-path="${emojiBtn.dataset.for}"]`);
    if (c && input){
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const newVal = input.value.slice(0, start) + emojiBtn.dataset.emoji + input.value.slice(end);
      input.value = newVal;
      input.dispatchEvent(new Event('input', { bubbles:true }));
      input.focus();
      const pos = start + emojiBtn.dataset.emoji.length;
      input.setSelectionRange(pos, pos);
    }
    const details = emojiBtn.closest('details');
    if (details) details.removeAttribute('open');
    return;
  }

  const avatarPicker = e.target.closest('.avatar-picker');
  if (avatarPicker){
    e.stopPropagation();
    if (!e.target.closest('.avatar-opt')) return;
  }

  const rollBtn = e.target.closest('[data-roll]');
  if (rollBtn){ handleRoll(rollBtn, e); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const c = activeChar();

  if (action === 'select-char'){
    state.activeId = btn.dataset.id;
    renderAll();
  }
  else if (action === 'new-char'){
    const nc = defaultCharacter(ui('newCharacter'));
    state.characters.push(nc);
    state.activeId = nc.id;
    saveNow(nc);
    renderAll();
  }
  else if (action === 'duplicate-char' && c){
    const copy = JSON.parse(JSON.stringify(c));
    copy.id = uid(); copy.name = c.name + ' (copie)';
    state.characters.push(copy);
    state.activeId = copy.id;
    saveNow(copy);
    renderAll();
  }
  else if (action === 'delete-char' && c){
    if (!confirm(ui('deleteConfirm', c.name))) return;
    if (state.mode === 'folder') deleteCharFromDisk(c);
    state.characters = state.characters.filter(x => x.id !== c.id);
    state.activeId = state.characters[0] ? state.characters[0].id : null;
    renderAll();
  }
  else if (action === 'export-char' && c){ downloadJSON(c, characterFilename(c.name)); }
  else if (action === 'export-all'){ downloadAllCharactersZip(); }
  else if (action === 'trigger-import'){ document.getElementById('file-input').click(); }
  else if (action === 'pick-folder'){ pickFolder().then(renderAll); }
  else if (action === 'unlink-folder'){ unlinkFolder(); }
  else if (action === 'reconnect-folder'){ pickFolder().then(renderAll); }
  else if (action === 'dismiss-onboard'){ /* obsolete */ }
  else if (action === 'clear-rolls'){ rollLog = []; renderRollLog(); }
  else if (action === 'toggle-dice-panel'){ toggleDicePanel(); }
  else if (action === 'add-dice'){ customDiceRows.push({ count:1, sides:6 }); renderDicePanel(); }
  else if (action === 'remove-dice'){ if (customDiceRows.length > 1) customDiceRows.splice(Number(btn.dataset.index), 1); renderDicePanel(); }
  else if (action === 'roll-custom-dice'){
    document.querySelectorAll('[data-dice-count]').forEach(el => { customDiceRows[Number(el.dataset.diceCount)].count = Number(el.value) || 1; });
    document.querySelectorAll('[data-dice-sides]').forEach(el => { customDiceRows[Number(el.dataset.diceSides)].sides = Number(el.value) || 20; });
    rollCustomDice();
  }
  else if (action === 'add-weapon' && c){ c.weapons.push({ name:'', toHit:'', damage:'', damageBonus:'' }); saveNow(c); renderWeapons(); }
  else if (action === 'remove-weapon' && c){ c.weapons.splice(Number(btn.dataset.index), 1); saveNow(c); renderWeapons(); }
  else if (action === 'add-feature' && c){ c.features.push({ title:'', body:'', category:'' }); saveNow(c); renderFeatures(); }
  else if (action === 'remove-feature' && c){ c.features.splice(Number(btn.dataset.index), 1); saveNow(c); renderFeatures(); }
  else if (action === 'add-spell' && c){ c.spells.push({ title:'', level:'', time:'', range:'', duration:'', cost:'', damage:'', description:'' }); saveNow(c); renderSpells(); }
  else if (action === 'remove-spell' && c){ c.spells.splice(Number(btn.dataset.index), 1); saveNow(c); renderSpells(); }
  else if (action === 'apply-threshold' && c){ c.corruption.threshold = Number(btn.dataset.value); saveNow(c); renderMain(); }
  else if (action === 'long-rest' && c){
    c.corruption.temp = 0;
    c.resources.forEach(r => { r.current = Number(r.max) || 0; });
    saveNow(c); renderCorruption(); renderResources();
  }
  else if (action === 'reset-passives' && c){
    c.passive = { perception:null, investigation:null, insight:null };
    saveNow(c); renderPassiveRow();
  }
  else if (action === 'toggle-inspiration' && c){
    c.inspiration = !c.inspiration;
    saveNow(c); renderMain();
  }
  else if (action === 'hp-damage' && c){
    const amount = Math.max(0, Number(document.getElementById('hp-adjust-amount').value) || 0);
    let remaining = amount;
    const temp = Number(c.hp.temp) || 0;
    const absorbed = Math.min(temp, remaining);
    c.hp.temp = temp - absorbed;
    remaining -= absorbed;
    c.hp.current = Math.max(0, (Number(c.hp.current) || 0) - remaining);
    saveNow(c); renderMain();
  }
  else if (action === 'hp-heal' && c){
    const amount = Math.max(0, Number(document.getElementById('hp-adjust-amount').value) || 0);
    c.hp.current = Math.min(Number(c.hp.max) || 0, (Number(c.hp.current) || 0) + amount);
    saveNow(c); renderMain();
  }
  else if (action === 'toggle-death-pip' && c){
    const kind = btn.dataset.kind, pip = Number(btn.dataset.pip);
    const cur = Number(c.deathSaves[kind]) || 0;
    c.deathSaves[kind] = pip < cur ? pip : pip + 1;
    saveNow(c); renderMain();
  }
  else if (action === 'reset-death-saves' && c){
    c.deathSaves = { success:0, failure:0 };
    saveNow(c); renderMain();
  }
  else if (action === 'adjust-score' && c){
    const key = btn.dataset.ability;
    c.abilities[key].score = Math.max(1, (Number(c.abilities[key].score) || 0) + Number(btn.dataset.delta));
    saveState(); renderAbilities(); renderPassiveRow(); renderSpellcasting();
  }
  else if (action === 'add-resource' && c){ c.resources.push({ name:'', max:1, current:1, formula:'', recharge:'' }); saveNow(c); renderResources(); }
  else if (action === 'remove-resource' && c){ c.resources.splice(Number(btn.dataset.index), 1); saveNow(c); renderResources(); }
  else if (action === 'reset-resource' && c){
    const r = c.resources[Number(btn.dataset.index)];
    r.current = Number(r.max) || 0;
    saveNow(c); renderResources();
  }
  else if (action === 'toggle-pip' && c){
    const r = c.resources[Number(btn.dataset.index)];
    const pip = Number(btn.dataset.pip);
    r.current = pip < (Number(r.current) || 0) ? pip : pip + 1;
    saveNow(c); renderResources();
  }
});

document.body.addEventListener('change', e => {
  if (e.target.id !== 'file-input') return;
  const file = e.target.files[0];
  if (!file) return;
  if (state.mode !== 'folder' || !state.dirHandle){
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : [data];
      let addedId = null;
      for (const ch of incoming){
        if (!ch || typeof ch !== 'object') continue;
        const merged = normalizeCharacter(Object.assign(defaultCharacter(ch.name), ch));
        merged.id = uid();
        state.characters.push(merged);
        state.activeId = merged.id;
        addedId = merged.id;
        await writeCharToDisk(merged);
      }
      if (addedId) renderAll();
    }catch(err){
      alert(ui('invalidJson'));
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  downloadBlob(blob, filename);
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Exportation de toutes les fiches : un vrai .zip contenant un .json par personnage.
   Le ZIP est créé directement dans le navigateur, sans dépendance externe. */
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++){
    crc ^= bytes[i];
    for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16(n){ return new Uint8Array([n & 255, (n >>> 8) & 255]); }
function u32(n){ return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]); }

function concatBytes(parts){
  const total = parts.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const part of parts){ out.set(part, offset); offset += part.length; }
  return out;
}

function zipFilename(name, used){
  const base = characterFilename(name);
  if (!used.has(base.toLowerCase())){ used.add(base.toLowerCase()); return base; }
  const dot = base.length - 5;
  const stem = base.slice(0, dot);
  let n = 2;
  while (used.has(`${stem} (${n}).json`.toLowerCase())) n++;
  const result = `${stem} (${n}).json`;
  used.add(result.toLowerCase());
  return result;
}

async function downloadAllCharactersZip(){
  if (!state.characters.length){
    alert(ui('empty'));
    return;
  }

  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  const usedNames = new Set();
  let offset = 0;

  for (const ch of state.characters){
    const filename = zipFilename(ch.name, usedNames);
    const nameBytes = encoder.encode(filename);
    const data = encoder.encode(JSON.stringify(ch, null, 2));
    const crc = crc32(data);

    const localHeader = concatBytes([
      new Uint8Array([0x50,0x4B,0x03,0x04]),
      u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0), nameBytes
    ]);
    localParts.push(localHeader, data);

    const centralHeader = concatBytes([
      new Uint8Array([0x50,0x4B,0x01,0x02]),
      u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), nameBytes
    ]);
    centralParts.push(centralHeader);
    offset += localHeader.length + data.length;
  }

  const centralDirectory = concatBytes(centralParts);
  const endRecord = concatBytes([
    new Uint8Array([0x50,0x4B,0x05,0x06]),
    u16(0), u16(0), u16(state.characters.length), u16(state.characters.length),
    u32(centralDirectory.length), u32(offset), u16(0)
  ]);

  const zip = concatBytes([...localParts, centralDirectory, endRecord]);
  downloadBlob(new Blob([zip], { type:'application/zip' }), 'grimoire-personnages.zip');
}
